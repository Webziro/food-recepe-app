project_id = "recipe-app-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "http://localhost:8081/**",
  "http://127.0.0.1:8081/**",
  "exp://localhost:19000/**"
]
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = false